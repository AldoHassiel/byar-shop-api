name: Auto-fill PR from Issue
on:
  pull_request:
    types: [opened]
jobs:
  fill-description:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
    steps:
      - name: Copiar descripción del issue al PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const match = branch.match(/(\d+)/);
            if (!match) {
              console.log('No se encontró número de issue en el nombre de la rama.');
              return;
            }
            const issueNumber = parseInt(match[1]);
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const issueBody = issue.data.body || '_El issue no tiene descripción._';
            const issueTitle = issue.data.title;

            // Marcar todas las tareas como completadas
            const issueBodyChecked = issueBody
              .replace(/- \[ \]/g, '- [x]')
              .replace(/\* \[ \]/g, '* [x]');

            const prBody = `## ${issueTitle}\n\nCloses #${issueNumber}\n\n${issueBodyChecked}`;
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: prBody,
            });
